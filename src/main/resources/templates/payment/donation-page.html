<!-- 후원 페이지 (donation-page.html) -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>후원하기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">

<h2 class="mb-4">후원하기</h2>

<!-- 현재 내 포인트 잔액 -->
<p>내 포인트 잔액: <span th:text="${walletBalance}"></span> P</p>

<!-- 후원 물품 선택 -->
<form id="donation-form" method="get" action="/api/donations/direct">
    <input type="hidden" name="userId" value="1"/> <!-- TODO: 테스트용 userId. 이후 인증 연동 -->

    <div class="mb-3">
        <label for="donationItem" class="form-label">후원 물품</label>
        <select id="donationItem" class="form-select" required>
            <option value="BOOK">교재 - 10,000원</option>
            <option value="FOOD">식료품 - 30,000원</option>
            <option value="SUPPLY">생활용품 - 50,000원</option>
        </select>
    </div>

    <div class="mb-3">
        <label class="form-label">후원 방식</label><br/>
        <input type="radio" name="donationType" value="POINT" checked> 포인트 후원
        <input type="radio" name="donationType" value="DIRECT"> 직접 결제
    </div>

    <button type="button" class="btn btn-primary" onclick="donate()">후원하기</button>
</form>

<script>
    // 후원하기 버튼 클릭 시 호출
    function donate() {
        // 후원 금액 (물품별 고정)
        const item = document.getElementById("donationItem").value;                                 // BOOK/FOOD/SUPPLY

        // 후원 방식 (포인트 or 직접 결제)
        const donationType = document.querySelector('input[name="donationType"]:checked').value;    // POINT or DIRECT

        // 후원 방식에 따라 처리
        // 1. 포인트 후원
        if (donationType === "POINT") {
            // TODO: 인증 연동 후 userId 동적 처리

            const body = new URLSearchParams({
                userId: "1",                                                        // TODO: 인증 연동 후 교체
                item: item                                                          // "BOOK" | "FOOD" | "SUPPLY"
            });

            // 포인트 후원 API 호출
            // 포인트 후원 → WalletController.donateWithPoints() 호출
            fetch("/api/donations/point", {
                method: "POST",                                                     // POST 요청
                headers: { "Content-Type": "application/x-www-form-urlencoded" },   // 폼 데이터 형식
                body                                                                // 요청 본문
            })
            .then(async res => { // 응답 처리
            // 성공 시 알림
            if (res.ok) {
                alert("포인트 후원 성공!")
            }
            // 실패 시 알림
            else {
                // 실패 메시지 읽기
                const errorMsg = await res.text();
                alert("포인트 후원 실패: " + errorMsg);        // 에러 메시지 표시
                }
            })
            .catch(err => { // 네트워크 등 기타 에러 처리
                alert("포인트 후원 에러: " + err.message);     // 에러 메시지 표시
            });
        }
        // 2. 직접 결제
        else {
            // TODO: 인증 연동 후 userId 동적 처리

            // 폼 데이터 생성
            const formData = new FormData();
            formData.append("userId", 1);                   // 테스트용 userId
            formData.append("item", item);                  // 후원 물품 ID

            // 직접 결제 API 호출
            // 직접 결제 → DonationController.donateDirectly() 호출
            fetch("/api/donations/direct", {                // API 엔드포인트
                method: "POST",                             // POST 요청
                body: formData                              // 폼 데이터 전송
            })
            .then(async res => { // 응답 처리
                // 성공 시 결제 페이지로 이동
                if (res.ok) {
                    const redirectUrl = await res.text();   // 서버에서 받은 redirect url
                    window.location.href = redirectUrl;     // 해당 URL로 이동
                }
                // 실패 시 알림
                else {
                    // 실패 메시지 읽기
                    // 서버에서 에러 메시지 텍스트로 전달
                    const errorMsg = await res.text();
                    alert("직접 결제 실패: " + errorMsg);     // 에러 메시지 표시
                }
            })
            .catch(err => { // 네트워크 등 기타 에러 처리
                alert("직접 결제 에러: " + err.message);      // 에러 메시지 표시
            });
        }
    }
</script>
</body>
</html>
