<!-- 충전 페이지 (charge-page.html) -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>포인트 충전</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">

<h2 class="mb-4">포인트 충전</h2>

<form id="charge-form" method="get" action="/api/wallets/charge">
    <input type="hidden" name="userId" value="1"/> <!-- TODO: 테스트용 userId -->

    <div class="mb-3">
        <label for="amount" class="form-label">충전 금액</label>
        <select id="amount" name="amount" class="form-select" required>
            <option value="10000">10,000원</option>
            <option value="30000">30,000원</option>
            <option value="50000">50,000원</option>
        </select>
    </div>

    <button type="submit" class="btn btn-success">충전하기</button>
</form>

</body>
</html>
