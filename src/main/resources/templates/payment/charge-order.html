<!-- 포인트 충전 결제 페이지
충전 위젯을 렌더링하고 충전 요청을 처리하는 페이지 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <title>포인트 충전</title>
    <script src="https://js.tosspayments.com/v1/payment-widget"></script>
</head>
<body class="container py-5">

<h2>포인트 충전</h2>
<p>충전 금액: <span th:text="${amount}"></span> 원</p>

<!-- 결제 UI -->
<div id="payment-method"></div>
<div id="agreement"></div>

<button id="payment-button" class="btn btn-success">충전하기</button>

<script>
    // 서버에서 전달된 결제 정보
    const amount = `[[${amount}]]`;             // 충전 금액
    const orderId = `[[${requestId}]]`;         // 주문 ID (고유해야 함)
    const orderName = amount + " 원 충전";       // 주문명
    const customerKey = `[[${customerKey}]]`;   // 고객 식별자 (고유해야 함)

    // Toss Payments 결제 위젯 초기화
    // 테스트용 클라이언트 키
    // 실제 서비스에서는 환경에 맞는 키 사용
    const widgetClientKey = "test_gck_docs_Ovk5rk1EwkEbP0W43n07xlzm";
    // 결제 위젯 생성
    // customerKey를 통해 고객 식별
    // customerKey: 고객 식별자 (고유해야 함)
    // widgetClientKey: 위젯 클라이언트 키 (테스트 또는 실제 키)
    const paymentWidget = PaymentWidget(widgetClientKey, customerKey);

    // 결제 수단 UI 렌더링
    paymentWidget.renderPaymentMethods("#payment-method", { value: amount });
    // 약관동의 UI 렌더링
    paymentWidget.renderAgreement("#agreement");

    // 충전 요청 처리
    document.getElementById("payment-button").addEventListener("click", function () {   // 충전하기 버튼 클릭 시
        paymentWidget.requestPayment({                                                  // 충전 요청
            orderId: orderId,                                                           // 주문 ID
            orderName: orderName,                                                       // 주문명
            successUrl: window.location.origin + "/charge-order-requested",             // 충전 성공 시 리디렉션 URL
            failUrl: window.location.origin + "/charge-fail",                           // 충전 실패 시 리디렉션 URL
            customerEmail: "test@example.com",                                          // 고객 이메일
            customerName: "홍길동",                                                      // 고객 이름
            customerMobilePhone: "01012345678"                                          // 고객 휴대폰 번호
        });
    });
</script>

</body>
</html>
